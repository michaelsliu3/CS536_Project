# Per-hunk levels (configs/levels_hunk/): one diff hunk is reviewed per call, as AACR-Bench's
# paper does for its non-agent rows, and every level starts from that hunk alone
# (src/tracer_context/hunks.py). They mirror configs/levels/ with one level added, H04_pr_diff.
#
# H01 min: the PR title and description plus this hunk; no other context. This is the paper's
# "no code context" setting.
inherit: ../tracer_levels_base.yaml
level: {name: H01_min, parent: null}
input: {pr_text: true, diff: true}
packing: {token_budget: 0}
